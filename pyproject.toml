[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyvault"
version = "0.1.0"
description = "个人 API 密钥保险箱（KeyVault）：本地加密钥匙串，专管 LLM Key / GitHub Token"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
keyvault = "main:main"

[tool.setuptools]
py-modules = ["main", "vault", "store", "audit", "gui", "cli", "config", "webui"]
include-package-data = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]